[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for real-time security scanning, secret detection, and AST safety audits for AI coding assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Open Source Contributor" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "claude-code",
    "security",
    "secret-scanner",
    "ai-agent",
    "devsecops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
mcp-sentinel = "mcp_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/businesscanva12-tech/mcp-sentinel"
Repository = "https://github.com/businesscanva12-tech/mcp-sentinel"
Issues = "https://github.com/businesscanva12-tech/mcp-sentinel/issues"
